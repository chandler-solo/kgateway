apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: gwtest
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
  namespace: gwtest
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: example
---
apiVersion: v1
kind: Service
metadata:
  name: mirror-svc
  namespace: gwtest
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: mirror
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-route
  namespace: gwtest
spec:
  parentRefs:
    - name: example-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: mirror-svc
              port: 80
      backendRefs:
        - name: example-svc
          port: 80
---
# Not targeted by the invalid policy: must keep its mirror and translate normally.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unaffected-route
  namespace: gwtest
spec:
  parentRefs:
    - name: example-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /unaffected
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: mirror-svc
              port: 80
      backendRefs:
        - name: example-svc
          port: 80
---
# A CRLF in hostRewriteLiteral is rejected at admission today, but an object stored
# before that schema existed can still carry one. Envoy's PGV rule (^[^\x00\n\r]*$)
# would reject the whole RouteConfiguration, so the controller must reject the policy
# and replace only the targeted route.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: invalid-request-mirror-policy
  namespace: gwtest
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: test-route
  requestMirror:
    hostRewriteLiteral: "shadow.example\r\nX-Injected: true"
