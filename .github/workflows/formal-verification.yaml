name: Formal Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  regression-profiles:
    name: Pinned xDS counterexamples
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Reproduce immutable stack findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: make formal-stack-regressions FORMAL_REGRESSION_ARGS="--artifacts $RUNNER_TEMP/formal-regressions/stack"
      - name: Preserve historical contents-gate counterexample
        env:
          GH_TOKEN: ${{ github.token }}
        run: make formal-legacy-contents FORMAL_REGRESSION_ARGS="--artifacts $RUNNER_TEMP/formal-regressions/legacy"
      - name: Reproduce October 16 stack findings with recorded test adapters
        env:
          GH_TOKEN: ${{ github.token }}
        run: make formal-stack-current FORMAL_REGRESSION_ARGS="--artifacts $RUNNER_TEMP/formal-regressions/stack-20261016"
      - name: Preserve regression receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pinned-xds-counterexamples
          path: |
            ${{ runner.temp }}/formal-regressions/*/*.json
            ${{ runner.temp }}/formal-regressions/*/*.jsonl
            ${{ runner.temp }}/formal-regressions/*/*.log
          if-no-files-found: error
  lean:
    name: Lean xDS spec
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Cache Lean toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('devel/formal/lean/lean-toolchain') }}
      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.elan/bin/lake" ]]; then
            curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Re-check proofs, model-check the spec, and conformance-check an implementation trace
        env:
          FORMAL_ARTIFACT_DIR: ${{ runner.temp }}/formal/lean
        run: make formal-lean
      - name: Check TLC safety and expected temporal counterexamples
        env:
          FORMAL_TLC_ARTIFACT_DIR: ${{ runner.temp }}/formal/tlc
        run: make formal-tlc
      - name: Pull pinned Envoy characterization image
        run: docker pull envoyproxy/envoy:v1.39.1@sha256:57e14a549d7bd43c8d3f6d03e8cfa653e037d4b38e133acd9b54f38c524401b4
      - name: Characterize Envoy directly in both panic profiles
        env:
          FORMAL_ENVOY_ARTIFACT_DIR: ${{ runner.temp }}/formal/envoy
        run: make formal-envoy
      - name: Validate explicit runtime profile receipts
        run: make formal-runtime-profiles FORMAL_RUNTIME_ARGS="--profile upstream --artifacts $RUNNER_TEMP/formal/runtime"
      - name: Preserve verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-verification-receipts
          path: ${{ runner.temp }}/formal
          if-no-files-found: error
