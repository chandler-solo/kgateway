# Evidence links, not universal discharge. The validator checks declarations;
# the runner preserves execution receipts. Open entries may cite partial tests.
assumptions:
  - id: GCP-A1
    summary: the simplified named EDS response guard omits equal-version subscription responses and declined-watch disposition
    status: open
    plannedDischarge: RF-007 requires modeling both CreateWatch and SetSnapshot paths, returned resources, and watch loss against v0.14.1-0.20260702184136-1cd1226616f5; parked-decline and unsubscribe repairs are present, immediate declines still lose requests
    specFile: devel/formal/lean/XdsSpec/Spec.lean
    specAnchors:
      - canRespond
      - edsWatchResponds
    dischargedBy:
      - file: pkg/kgateway/proxy_syncer/perclient_test.go
        test: TestSnapshotPerClientFilteredEdsSnapshotRespondsToNamedADSRequestAfterClusterRemoved
      - file: pkg/kgateway/proxy_syncer/perclient_test.go
        test: TestSnapshotPerClientServiceNameEdsSnapshotRespondsToNamedADSRequestAfterClusterRemoved
  - id: GCP-A2
    status: characterized
    summary: the snapshot cache retains the last published snapshot when a per-client entry is deleted
    specFile: devel/formal/lean/XdsSpec/Spec.lean
    specAnchors:
      - deleteRetainsLastGood
    dischargedBy:
      - file: pkg/kgateway/proxy_syncer/perclient_test.go
        test: TestSnapshotPerClientClientRemovalRetainsServedCache
  - id: ENV-A1
    summary: the abstract convergence activation guard requires dependency closure; a general Envoy usable-endpoint activation guarantee is unproven and must not constrain first publication
    status: open
    plannedDischarge: October 16 direct runtime profiles now cover pinned upstream v1.39.1 and enterprise standard/FIPS v1.39.1-patch1 for warming, references, ADS secrets and restart. Controller integration, multi-worker behavior, peering, enterprise extension semantics and standalone SDS still require live evidence; these runs do not establish a general activation guarantee.
    specFile: devel/formal/lean/XdsSpec/Spec.lean
    specAnchors:
      - activateNew
      - activeSnapshotClosed
    dischargedBy:
      - file: test/e2e/features/xds_warming/suite.go
        test: TestRouteUpdateToEmptyBackendPublishesTruth
      - file: test/e2e/features/xds_warming/suite.go
        test: TestWeightedRouteToEmptyBackendServesMixedTruth
      - file: test/e2e/features/xds_warming/suite.go
        test: TestInitialRouteToEmptyBackendServes503UntilReady
  - id: IMPL-A1
    summary: EDS row-contribution folds are assumed collision-free for compared revisions; finite corpus tests cannot prove injectivity
    status: open
    plannedDischarge: RF-008. VersionDigest.lean states the contract (determinism plus collision freedom on the compared domain) and proves the name-set abstraction is payload-blind; the schema-2 trace rule detects version reuse per client at runtime. The collision assumption itself remains an assumption; a revision allocator would discharge it at the cost of input-idempotent versions. RF-025 October 14 uses no-marshal row contributions; equal bytes alone do not imply equal versions.
    specFile: devel/formal/lean/XdsSpec/VersionDigest.lean
    specAnchors:
      - DigestContract
      - nameSetVersion_blind
      - payload_change_changes_digest
      - xorDigest_cancels
    dischargedBy:
      - file: pkg/kgateway/proxy_syncer/perclient_version_property_test.go
        test: TestFilterEndpointResourcesForClusters_VersionDigestProperties
  - id: GCP-A3
    status: characterized
    summary: ADS wire-delivery ordering - quiet-stream additions are CDS-first in both server modes (cache type ordering), WithOrderedADS closes only the busy-stream randomization, ACK skew delivers RDS before CDS deterministically in both modes, and combined removals ship the cluster removal first in both modes
    specFile: devel/formal/lean/XdsSpec/OrderedADS.lean
    specAnchors:
      - orderedAdditionSystem
      - ackSkewAdditionBugSystem
      - orderedRemovalStillBrokenBugSystem
      - activeRouteHasCluster
    dischargedBy:
      - file: pkg/kgateway/proxy_syncer/xds_delivery_order_probe_test.go
        test: TestADSAdditionOnQuietStreamIsClusterFirst
      - file: pkg/kgateway/proxy_syncer/xds_delivery_order_probe_test.go
        test: TestADSAckSkewDeliversRouteBeforeClusterEvenWithOrderedADS
      - file: pkg/kgateway/proxy_syncer/xds_delivery_order_probe_test.go
        test: TestADSOrderedServerStillDeliversClusterRemovalBeforeRouteUpdate
  - id: GCP-A4
    status: characterized
    summary: go-control-plane dispatches OnStreamRequest/OnStreamClosed for one stream strictly sequentially, and OnStreamClosed still fires when OnStreamRequest returns an error
    specFile: devel/formal/lean/XdsSpec/ClientIdentity.lean
    specAnchors:
      - safeSystem
      - countsMatchStreams
    dischargedBy:
      - file: pkg/kgateway/proxy_syncer/xds_callback_serialization_probe_test.go
        test: TestADSCallbacksAreSerializedPerStream
      - file: pkg/kgateway/proxy_syncer/xds_callback_serialization_probe_test.go
        test: TestADSStreamClosedFiresAfterRequestError
  - id: KRT-A1
    summary: per-client collections eventually reflect current clients x backends (no permanently dropped fan-out events)
    status: open
    plannedDischarge: defer watchdog (fix/defer-watchdog branch) re-publishes for any live proxy stranded without a current snapshot; list its tests here when it lands. XdsSpec.stuck_client_has_recovery_path supplies an existential recovery path, not scheduler fairness or eventual coherent input.
    specFile: devel/formal/lean/XdsSpec/Liveness.lean
    specAnchors:
      - stuck_client_has_recovery_path
      - heartbeatRederive
  - id: IMPL-A2
    status: characterized
    summary: snapshotPerClient for one UniquelyConnectedClient writes only that client's snapshot-cache entry
    specFile: devel/formal/lean/XdsSpec/MultiClient.lean
    specAnchors:
      - isolation
      - multi_safety
    dischargedBy:
      - file: pkg/kgateway/proxy_syncer/perclient_test.go
        test: TestSnapshotPerClientPartialUpdateForOneClientDoesNotPoisonAnotherClient
  - id: GCP-A5
    status: characterized
    summary: the pinned go-control-plane (1cd122661 since 2026-09-12) retains a declined parked named watch and delivers the next aligned snapshot to it, still registers no watch for a declined new request, and answers equal-version requests for new unreturned resources; v0.14.0 discarded both declined entries
    specFile: devel/formal/lean/XdsSpec/GcpWatch.lean
    specAnchors:
      - immediateEligible
      - requestAccountedFor
      - retainDeclined
    dischargedBy:
      - file: devel/formal/gcpprobe/watch_test.go
        test: TestParkedNamedWatchIsRetainedOnDeclinedResponse
      - file: devel/formal/gcpprobe/watch_test.go
        test: TestDeclinedNewRequestRegistersNoWatch
      - file: devel/formal/gcpprobe/watch_test.go
        test: TestEqualVersionRespondsForNewlySubscribedResource
  - id: GCP-A6
    status: open
    summary: a failed publication is eventually followed by a coherent publication while its request remains admitted and the stream can send
    plannedDischarge: WatchDeliveryComposition checks progress under explicit weak fairness of CorrectAgain and Send. NoRetry is a temporal counterexample; the partial-installation trace proves only the finite Go boundary. Establish a reachable retry mechanism and cancellation/queue scheduling assumptions before claiming implementation liveness.
    specFile: devel/formal/tla/WatchDeliveryComposition.tla
    specAnchors:
      - CorrectAgain
      - SilentClientEventuallySent
    dischargedBy:
      - file: devel/formal/gcpprobe/installation_test.go
        test: TestInstallationSurvivesPartialResponseFailure
  - id: IMPL-A3
    status: open
    summary: publication, cache and stream generations refer to the same authenticated client lifecycle
    plannedDischarge: ConnectionGenerations models a proposed fence for one key and two generations. Implement and test shared warm/cold streams, atomic disconnect reclamation and downstream XDSClientState wiring; then relate timer and response generations to the model.
    specFile: devel/formal/tla/ConnectionGenerations.tla
    specAnchors:
      - Reconnect
      - NoResponseFromEarlierGeneration
