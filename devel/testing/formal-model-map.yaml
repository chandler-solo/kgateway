# Machine-checked mapping from the per-cluster readiness spec
# (devel/formal/lean/XdsSpec/PerClusterReadiness.lean) to the Go code it
# describes. Gated by formal_model_map_test.go.
#
# Statuses:
#   covered   - snapshotPerClient implements the obligation; the listed
#               tests discharge it.
#   divergent - the current code is one of the spec's bug systems; the
#               listed divergence pins assert the CURRENT behavior so the
#               gap is load-bearing in CI. When the per-cluster synthesis
#               lands, the pins fail and must be rewritten to assert the
#               safe-system behavior, and the entry flips to covered.
#   open      - not implemented; the note says where the work is tracked.
obligations:
  - id: selected-CLA-payload-contribution-pair
    summary: a current derived assignment wins over retained and synthesized entries as one payload/contribution pair
    specFile: devel/formal/lean/XdsSpec/PublicationSelection.lean
    specAnchors:
      - sharedAssignmentKeepsCurrentPair
      - carryKeepsPair
      - omissionIsNotEmptyTruth
    status: covered
    note: abstract selection contract plus research Go regression, not a Go refinement theorem or hash injectivity proof. The updated stack remains a separate failing profile. Error exclusion applies to the selected resource key, not every CLA shared by an errored consumer.
    tests:
      - file: pkg/kgateway/proxy_syncer/publication_composition_test.go
        test: TestCarryPreservesCurrentSharedAssignment
  - id: equality-must-determine-publication
    summary: metadata that changes publication must invalidate the equality projection
    specFile: devel/formal/lean/XdsSpec/PublicationSelection.lean
    specAnchors:
      - policyChangeMustInvalidate
    status: covered
    note: theorem is conditional on projection adequacy. Research compares the tested metadata; the October 16 stack omits error-only wrapper changes. Neither finite test proves adequacy for all Go inputs.
    tests:
      - file: pkg/kgateway/proxy_syncer/publication_composition_test.go
        test: TestWrapperEqualityIncludesDerivationState
  - id: silent-client-cache-to-response-progress
    summary: stable coherent input reaches a silent client only with retained admission and a fair correcting publication after cancellation
    specFile: devel/formal/tla/WatchDeliveryComposition.tla
    specAnchors:
      - CorrectAgain
      - SilentClientEventuallySent
    status: open
    note: bounded temporal Fixed policy assumes admission retention and a new publication after failure. Go still loses immediately declined requests and supplies no automatic retry theorem. Finite observations cannot establish eventuality.
    tests:
      - file: devel/formal/gcpprobe/lifecycle_test.go
        test: TestLifecycleWatchAdmissionProfiles
      - file: devel/formal/gcpprobe/installation_test.go
        test: TestInstallationSurvivesPartialResponseFailure
  - id: connection-generation-cache-and-queue-fence
    summary: neither retained cache nor queued response may bypass the intended new-connection publication hold
    specFile: devel/formal/tla/ConnectionGenerations.tla
    specAnchors:
      - NoResponseFromEarlierGeneration
      - StableConnectionEventuallySent
    status: open
    note: two-generation model checks a proposed fence and preserves separate old-cache and old-queue controls. The October 16 stack Go fixture reproduces stale cache exposure; queued-generation refinement and authenticated shared-key integration remain open.
  - id: C0-first-cache-publication
    summary: complete referenced CDS permits first cache publication with empty CLAs, including after cache restart; missing nonexempt CDS still defers
    specFile: devel/formal/lean/XdsSpec/PerClusterReadiness.lean
    specAnchors:
      - coldSafeSystem
      - coldStarvationBugSystem
      - coldClosed
    status: covered
    note: cache absence is not evidence that Envoy is cold. Empty endpoint truth can replace a warm proxy's retained state after controller restart. Warm C3 now tests row presence, not contents. Permanent missing-CDS starvation remains open on the research profile.
    tests:
      - file: pkg/kgateway/proxy_syncer/perclient_percluster_test.go
        test: TestSnapshotPerClientFirstPublishWithEmptyEndpoints
  - id: C1-steady-state-publish
    summary: a referenced cluster with usable endpoints publishes its current truth
    specFile: devel/formal/lean/XdsSpec/PerClusterReadiness.lean
    specAnchors:
      - publishA
    status: covered
    tests:
      - file: pkg/kgateway/proxy_syncer/perclient_test.go
        test: TestSnapshotPerClientEndpointOnlyUpdateOnlyChangesEDSVersion
  - id: C2-scale-to-zero-publishes-truth
    summary: a previously-active cluster that scales to zero publishes its empty CLA so Envoy drops the dead endpoints
    specFile: devel/formal/lean/XdsSpec/PerClusterReadiness.lean
    specAnchors:
      - publishA
      - truthPublishedA
    status: covered
    note: derived empty truth now publishes directly; absent rows are classified separately before synthesis. The historical model retains its contents gate for comparison.
    tests:
      - file: pkg/kgateway/proxy_syncer/perclient_percluster_test.go
        test: TestSnapshotPerClientScaleToZeroPublishesEmptyCLA
  - id: C3-derived-empty-publishes-truth
    summary: a derived CLA permits a warm route flip even when empty; only a missing row can defer it
    specFile: devel/formal/lean/XdsSpec/DerivedEndpointTruth.lean
    specAnchors:
      - mayPublish
      - emptyTruthPublishes
      - healthDoesNotGate
    status: covered
    note: cache-boundary policy checks, not proof of Go refinement or Envoy application; legacy contents-gate counterexamples remain separately pinned
    tests:
      - file: pkg/kgateway/proxy_syncer/perclient_test.go
        test: TestSnapshotPerClientDerivedEmptyEndpointPublishesRouteTruth
      - file: pkg/kgateway/proxy_syncer/warm_starvation_test.go
        test: TestWarmDerivedEmptyBackendPublishesUnrelatedRouteAndSecret
      - file: test/e2e/features/xds_warming/suite.go
        test: TestRouteUpdateToEmptyBackendPublishesTruth
      - file: test/e2e/features/xds_warming/suite.go
        test: TestWeightedRouteToEmptyBackendServesMixedTruth
  - id: C3-underived-flip-isolation
    summary: an underived newly referenced backend holds routing types while other endpoint updates can publish
    specFile: devel/formal/lean/XdsSpec/DerivedEndpointTruth.lean
    specAnchors:
      - missingRowDefers
    status: covered
    note: the research branch still has no bounded publication timers; the pinned stack has separate timer regressions
    tests:
      - file: pkg/kgateway/proxy_syncer/perclient_percluster_test.go
        test: TestSnapshotPerClientWarmingClusterHoldsOnlyRouteFlip
  - id: C4-removed-cluster-prunes-cla
    summary: a cluster removed from CDS takes its CLA with it (EDS subset, named-watch respondability)
    specFile: devel/formal/lean/XdsSpec/Spec.lean
    specAnchors:
      - cacheSnapshotClosed
    status: covered
    tests:
      - file: pkg/kgateway/proxy_syncer/perclient_test.go
        test: TestSnapshotPerClientFiltersStaleEndpointResourcesWhenClusterRemoved
  - id: C5-cla-travels-with-cluster
    summary: a published CLA is always accompanied by its CDS cluster (no orphans; constrains any future carry-forward mechanism)
    specFile: devel/formal/lean/XdsSpec/PerClusterReadiness.lean
    specAnchors:
      - noOrphanB
    status: covered
    note: also enforced on every recorded publish by the trace checker's no-orphan-cla rule (XdsSpec/TraceCheck.lean).
    tests:
      - file: pkg/kgateway/proxy_syncer/perclient_test.go
        test: TestFilterEndpointResourcesForClusters_FiltersStaleClusterLoadAssignments
  - id: KRT-A1-heartbeat-restores-progress
    summary: a client stuck in the defer window converges within one watchdog re-derivation
    specFile: devel/formal/lean/XdsSpec/Liveness.lean
    specAnchors:
      - stuck_client_has_recovery_path
    status: open
    note: the theorem supplies a coherent future candidate and proves an existing recovery path, not temporal progress. No production watchdog is established here. KRT fairness/refinement remains KRT-A1.
  - id: ordered-ADS-delivery-windows
    summary: route updates must never reach the wire before the CDS carrying their cluster, and cluster removals must never reach the wire before the RDS de-referencing them; three real windows exist (busy-stream randomization, ACK skew, combined removals)
    specFile: devel/formal/lean/XdsSpec/OrderedADS.lean
    specAnchors:
      - orderedAdditionSystem
      - ackSkewAdditionBugSystem
      - orderedRemovalStillBrokenBugSystem
    status: divergent
    note: setup passes EnableOrderedAds to NewControlPlane. Both modes are characterized; ACK skew and combined removals persist. The model safe removal guard observes route deactivation, which a timer alone does not establish. RF-010 tracks application-barrier and timeout-policy work.
    divergencePins:
      - file: pkg/kgateway/proxy_syncer/xds_delivery_order_probe_test.go
        test: TestADSAckSkewDeliversRouteBeforeClusterEvenWithOrderedADS
      - file: pkg/kgateway/proxy_syncer/xds_delivery_order_probe_test.go
        test: TestADSOrderedServerStillDeliversClusterRemovalBeforeRouteUpdate
  - id: client-identity-heals-on-drift
    summary: a connected client's identity (role~hash(AugmentedLabels)~ns) is re-derived from current pod state on every stream request; genuine drift closes the stream so the client re-identifies, transient derivation failures keep the established identity, and re-derivation starts from the pinned original role so it never false-closes on the server's own node augmentation
    specFile: devel/formal/lean/XdsSpec/ClientIdentity.lean
    specAnchors:
      - safeSystem
      - frozenIdentityBugSystem
      - reaugmentFalseCloseBugSystem
      - quietStreamStuckBugSystem
      - countsMatchStreams
    status: covered
    note: upstream #14582 (merged into main 2026-09-11, into this branch 2026-09-12 at f895d2fbbb) implements the safe system - per-request re-derivation, close on genuine drift, keep the established identity on transient lookup failure, pinned original role. The former divergence pin TestUniqueClientsIdentityFrozenAtFirstRequest failed on the merge exactly as its comment predicted and was removed; upstream's unit tests below and the xdsidentityrace e2e suite discharge the obligation. The quietStreamStuckBugSystem hole remains - the heal needs a DiscoveryRequest to arrive, so on a quiet stream staleness is bounded only by the next config push (a server-side request source such as the KRT-A1 watchdog or gRPC MaxConnectionAge would close it). The refcount algebra relies on assumption GCP-A4.
    tests:
      - file: pkg/krtcollections/uniqueclients_test.go
        test: TestUniqueClientsReidentifyOnPodChange
      - file: pkg/krtcollections/uniqueclients_test.go
        test: TestUniqueClientsFollowUpWithReusedAugmentedNode
      - file: pkg/krtcollections/uniqueclients_test.go
        test: TestUniqueClientsKeepIdentityWhenPodLookupFails
      - file: pkg/krtcollections/uniqueclients_test.go
        test: TestUniqueClientsLocalClusterGatingSurvivesIdentityReDerivation
  - id: errored-cluster-fails-closed
    summary: an errored cluster (e.g. invalid BackendTLSPolicy) leaves the served CDS so its routes 5xx, and is never carried forward from a previous snapshot - even while a route flip is held for an unrelated cluster
    specFile: devel/formal/lean/XdsSpec/PerClusterReadiness.lean
    specAnchors:
      - errorA
      - buggyServeErroredA
      - truthPublishedA
    status: covered
    note: fail-closed is the Gateway API conformance requirement (BackendTLSPolicyInvalidCACertificateRef / BackendTLSPolicyInvalidKind require "receive a 5xx"); the fail-open last-good restore was rejected in PR 13976 after those conformance failures and is kept as the ErroredRestoreBug liveness counterexample. Coherent publishes drop errored clusters (gate exemption) and resolveDeferredPerCluster excludes them from held-flip carry.
    tests:
      - file: pkg/kgateway/proxy_syncer/perclient_test.go
        test: TestSnapshotPerClientStillPublishesWhenReferencedClusterErrored
      - file: pkg/kgateway/proxy_syncer/perclient_percluster_test.go
        test: TestSnapshotPerClientErroredClusterIsNotCarriedDuringHeldFlip
